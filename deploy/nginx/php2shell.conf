# nginx terminates TLS and forwards to the shield; the shield forwards to an
# nginx (or Apache) vhost bound to localhost that talks to PHP-FPM.
#
#   client -> nginx :443 -> shield 127.0.0.1:8081 -> nginx 127.0.0.1:8080 -> php-fpm
#
# Make sure nothing else exposes the 127.0.0.1:8080 vhost or PHP-FPM itself.

server {
    listen 443 ssl;
    server_name example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 16m;   # keep in line with the shield's -max-body

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name example.com;
    root /var/www/html;
    index index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

# Run the shield with: php2shell-shield -listen 127.0.0.1:8081 -upstream http://127.0.0.1:8080
